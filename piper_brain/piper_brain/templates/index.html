<div class="card" id="agent-terminal" style="background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; margin-top: 20px; font-family: monospace;">
    <h2 style="color: #ffa500; margin-top: 0;">&#9670; Piper Task Command Console</h2>
    <div id="terminal-history" style="height: 180px; overflow-y: auto; background: #010409; padding: 12px; border-radius: 6px; margin-bottom: 12px; text-align: left; color: #58a6ff; border: 1px solid #21262d; line-height: 1.4;">
        <span style="color: #8b949e;">[SYSTEM] Interface initialized. Standing by for direct user tasking...</span>
    </div>
    <div style="display: flex; gap: 10px;">
        <input type="text" id="cmd-input" placeholder="Ask a question or specify a new automated research task..." style="flex-grow: 1; background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; padding: 12px; border-radius: 6px; font-family: monospace; font-size: 14px;">
        <button onclick="submitCommand()" style="background: #238636; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-family: monospace; font-weight: bold; cursor: pointer; font-size: 14px;">Execute</button>
    </div>
    <div class="video-container" style="text-align: center; margin-bottom: 20px;">
        <img src="/video_feed" alt="Piper Live Stream" style="width: 100%; max-width: 1280px; border: 1px solid #00ff00; border-radius: 4px;" />
    </div>
    </div><div class="status-container" style="margin-bottom: 15px; padding: 10px; background-color: #1e1e24; border-radius: 5px; border-left: 5px solid #00ff00;">
        <h3 style="margin: 0; color: #ffffff;">System Mode: 
            <span id="current-state" style="color: #00ff00; font-weight: bold;">SOLO</span>
        </h3>
        <p id="active-task" style="margin: 5px 0 0 0; color: #a0a0a0; font-size: 0.9em;">Awaiting stream telemetry...</p>
    </div>
    <div class="telemetry-grid" style="display: flex; gap: 20px; margin-bottom: 20px;">
    <div class="status-container" style="flex: 1; padding: 15px; background-color: #1e1e24; border-radius: 5px; border-left: 5px solid #ffcc00;">
        <h3 style="margin: 0; color: #ffffff;">System Mode: <span id="current-state" style="color: #ffcc00; font-weight: bold;">SOLO</span></h3>
        <p id="active-task" style="margin: 5px 0 0 0; color: #a0a0a0; font-size: 0.9em;">Awaiting stream telemetry...</p>
    </div>
    <div class="objects-container" style="flex: 1; padding: 15px; background-color: #1e1e24; border-radius: 5px; border-left: 5px solid #3399ff;">
        <h3 style="margin: 0; color: #ffffff;">Objects Currently in View</h3>
        <ul id="object-list" style="margin: 8px 0 0 0; padding-left: 20px; color: #00ff00; font-family: monospace; font-size: 1.1em;">
            <li style="color: #a0a0a0;">No objects detected...</li>
        </ul>
    </div>
</div>

<script>
function submitCommand() {
    let inputEl = document.getElementById('cmd-input');
    let historyEl = document.getElementById('terminal-history');
    let text = inputEl.value.trim();
    if(!text) return;
    
    // Print user entry locally instantly
    historyEl.innerHTML += "<br><span style='color:#79c0ff;'>&gt; Steve:</span> " + text;
    historyEl.scrollTop = historyEl.scrollHeight;
    
    fetch('/api/command', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ command: text })
    })
    .then(res => res.json())
    .then(data => {
        historyEl.innerHTML += "<br><span style='color:#56d364;'>&gt; Piper:</span> " + data.response;
        historyEl.scrollTop = historyEl.scrollHeight;
    })
    .catch(err => {
        historyEl.innerHTML += "<br><span style='color:#f85149;'>[ERROR] Failed to dispatch directive to backend routing core.</span>";
    });
    inputEl.value = '';
}

// Allow pressing 'Enter' key inside the text field to submit
document.getElementById('cmd-input').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') submitCommand();
});
</script>
<script>
    function updateSystemState() {
        fetch('/api/state')
            .then(response => response.json())
            .then(data => {
                // 1. Update State Text
                const stateSpan = document.getElementById('current-state');
                const taskP = document.getElementById('active-task');
                stateSpan.innerText = data.state;
                taskP.innerText = data.active_task;

                if (data.state === "TEAMING") {
                    stateSpan.style.color = "#00ff00";
                } else if (data.state === "CHATTING") {
                    stateSpan.style.color = "#3399ff";
                } else {
                    stateSpan.style.color = "#ffcc00";
                }

                // 2. Update Active Object Ledger
                const listContainer = document.getElementById('object-list');
                listContainer.innerHTML = ""; // Flush old items

                if (!data.objects || data.objects.length === 0) {
                    listContainer.innerHTML = `<li style="color: #a0a0a0;">No objects detected...</li>`;
                } else {
                    data.objects.forEach(obj => {
                        const li = document.createElement('li');
                        // Capitalize labels nicely
                        li.innerText = obj.charAt(0).toUpperCase() + obj.slice(1);
                        listContainer.appendChild(li);
                    });
                }
            })
            .catch(err => console.error('Error fetching dashboard telemetry matrix:', err));
    }
    setInterval(updateSystemState, 400); // Check every 400ms
</script>
